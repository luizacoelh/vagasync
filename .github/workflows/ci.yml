name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main]

jobs:
  lint-build:
    name: Lint + TypeScript + Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Mesma major do "engines" do package.json (>=22 <23)
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      # Regras de deduplicação (lib/jobDedup.ts), nós de código do workflow
      # do n8n e Job.source gravado pelo webhook/cadastro manual. Sem rede:
      # o Gemini é simulado e o banco é um SQLite temporário criado pelas
      # migrations (tests/jobSource.test.mjs)
      - name: Testes
        run: npm test

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Build
        run: npm run build
        env:
          # Necessário para o build compilar sem erros de variável ausente.
          # Valores falsos — só o TypeScript precisa compilar, não conectar.
          DATABASE_URL: "file:./ci-check.db"
          AUTH_SECRET: "ci-placeholder-not-used-in-build"
          NEXTAUTH_URL: "http://localhost:3000"
          GEMINI_API_KEY: "ci-placeholder"
          N8N_WEBHOOK_SECRET: "ci-placeholder"
          TURSO_DATABASE_URL: "libsql://placeholder.turso.io"
          TURSO_AUTH_TOKEN: "ci-placeholder"

  migrations:
    name: Migrations em banco limpo + check:turso
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Mesma major do "engines" do package.json (>=22 <23)
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Aplicar migrations num banco SQLite limpo
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "file:./ci-fresh.db"

      - name: check:turso contra banco local (sem credenciais Turso)
        run: npm run check:turso -- --file ./ci-fresh.db
        env:
          DATABASE_URL: "file:./ci-fresh.db"
